limit_req_zone $binary_remote_addr zone=api_clients:10m rate=4r/s;
server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 16k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
  limit_req zone=api_clients burst=40 nodelay;
  limit_req_status 429;
  error_page 429 = @rate_limited;
  proxy_pass http://backend:8000;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
 }
 location @rate_limited {
  default_type application/json;
  add_header Retry-After 1 always;
  return 429 '{"error":{"code":"rate_limited","message":"Please retry shortly"}}';
 }
 location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
