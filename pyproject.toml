[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rad-shoes"
version = "0.1.0"
description = "Persian footwear discovery through measured construction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "python-dotenv>=1,<2", "pgvector>=0.4,<0.5", "numpy>=2,<3"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]
embeddings = ["torch==2.15.0", "transformers==4.57.6", "Pillow==12.3.0"]
[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--tb=short"
[tool.ruff]
line-length = 110
target-version = "py311"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
files = ["backend/app"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.setuptools.package-data]
app = ["content/*.json"]
